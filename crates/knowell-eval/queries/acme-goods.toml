# Graded retrieval queries for the `acme-goods` fixture (knowell-eval).
#
# kind:  symbol | behavior | cross_project | contract | config | i18n | history_doc | absent
# lang:  en | tr
# grade: 3 = the answer, 2 = directly involved, 1 = useful context.
#
# Rules (enforced when the set is loaded):
# - ids are unique lowercase slugs;
# - `relevant` lists only hand-written core files as `<project>/<path>`,
#   never generated noise and never `infra/.env` (excluded by path);
# - `absent` queries ask for behaviour that does not exist and list nothing.
# Queries marked "paraphrase" in their notes deliberately avoid the words used
# in the code.

version = 1
fixture = "acme-goods"

