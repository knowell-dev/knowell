knowell-eval.workspace = true
knowell-graph.workspace = true
knowell-link.workspace = true
knowell-index.workspace = true
knowell-knowledge.workspace = true
knowell-lexical.workspace = true
knowell-mcp.workspace = true
knowell-parse.workspace = true
knowell-query.workspace = true
knowell-secrets.workspace = true
knowell-server.workspace = true
# Git refs and tree diffs for `analyze_impact` on committed diffs and for
# detecting a caller's worktree.
knowell-source.workspace = true
knowell-store.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
axum.workspace = true
tower = { workspace = true, features = ["util"] }
# Creates and drops one throwaway database per integration test.
sqlx.workspace = true
tempfile.workspace = true

