[package]
name = "knowell-engine"
description = "Knowell engine facade: wires indexing, storage, lexical, semantic and graph search, memory into the MCP tools and the REST API."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[dependencies]
knowell-auth.workspace = true
knowell-config.workspace = true
knowell-core.workspace = true
knowell-embed.workspace = true
# The `hybrid` retriever implements `knowell_eval::Retriever` so `know eval run`
