name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Knowell is pre-1.0 and under active development. Please do not paste secrets,
        API keys, `.env` contents, or private code. For security problems use
        [private vulnerability reporting](https://github.com/knowell-dev/knowell/security/advisories/new)
        instead of this form.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: A minimal, synthetic reproduction is best.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `know --version`, or the commit you built from.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux, Other]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or output
      description: Redact anything sensitive before pasting.
      render: shell
