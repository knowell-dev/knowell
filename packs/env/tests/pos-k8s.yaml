apiVersion: apps/v1
kind: Deployment
metadata:
  name: depot
spec:
  template:
    spec:
      containers:
        - name: api
          image: example/depot:1.0
          env:
            - name: DEPOT_REGION
              value: eu-west
            - name: DEPOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: depot
                  key: token
