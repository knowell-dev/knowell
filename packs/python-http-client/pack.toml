name = "python-http-client"
version = "1.0.0"
description = "HTTP calls from Python: requests / httpx module functions and client or session objects (`client.get(\"/x\")`)."
languages = ["python"]
limits = """
- `base_url` of `httpx.Client` / sessions is not applied; relative paths are matched as written.
- f-string interpolations become dynamic parts; `.format()` and `%` formatting are recorded as unresolved.
- Receivers are recognised by name (`requests`, `httpx`, `client`, `session`, `http`, `*_client`, `*_session`).
- Calls whose URL is a plain variable (`client.post(path)`) are not recorded: a name argument is indistinguishable from ORM calls such as `session.get(Model, id)`.
"""

[detect]
python = ["requests", "httpx", "aiohttp"]
imports = ["requests", "httpx", "aiohttp"]

[[rules]]
id = "client-call"
query = "client_call.scm"
languages = ["python"]
kind = "endpoint"
role = "consumer"
key = "{verb|upper} {url}"
anchor = "call"
resolve = ["url"]
