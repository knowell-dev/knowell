name = "nestjs"
version = "1.0.0"
description = "NestJS HTTP controllers (@Controller prefix + @Get/@Post/...) and microservice handlers (@EventPattern/@MessagePattern)."
languages = ["typescript", "tsx"]
limits = """
- `app.setGlobalPrefix()`, `RouterModule` paths and URI versioning (`@Version`) are not applied.
- Controller prefixes given as arrays or option objects (`@Controller({ path })`) are not read; such routes get no prefix.
- Route paths built at run time are recorded as dynamic.
"""

[detect]
npm = ["@nestjs/common", "@nestjs/core", "@nestjs/microservices"]
imports = ["@nestjs/"]

[[rules]]
id = "controller-route"
query = "routes.scm"
languages = ["typescript", "tsx"]
kind = "endpoint"
role = "producer"
key = "{verb|upper} /{prefix}/{path}"
symbol = "handler"
anchor = "route"

[[rules]]
id = "message-handler"
query = "messages.scm"
languages = ["typescript", "tsx"]
kind = "topic"
role = "consumer"
key = "{topic}"
symbol = "handler"
anchor = "route"
resolve = ["topic"]
