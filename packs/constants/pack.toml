name = "constants"
version = "1.0.0"
description = "Module-level string constants (and string lists) of TS/JS, Python, Go, Rust, Java, Kotlin, Dart and C#; other packs resolve identifiers such as topic or URL constants through them."
languages = ["typescript", "tsx", "javascript", "python", "go", "rust", "java", "kotlin", "dart", "csharp"]
limits = """
- Only module-level (top-level or static) declarations initialised with a string literal, a list of string literals, or another such constant.
- A name defined with different values in several files is not resolved unless the use is in one of those files.
- Values that look like secrets are redacted before they are read.
"""

[[bindings]]
id = "ts-const"
query = "const.scm"
languages = ["typescript", "tsx", "javascript"]
scope = "project"
name = "name"
value = "{value}"
resolve = ["value"]
constant = true

